<div class="container main-container">
  <h4>Demo form</h4>
  <hr/>
  <form (ngSubmit)="submit()" [formGroup]="signupForm" novalidate>
    <div class="form-horizontal">
      <div class="form-group">
        <label class="col-md-2 control-label" for="name">Complete name</label>
        <div class="col-md-10">
          <input
            [ngClass]="{'is-invalid': displayMessage['name'] }"
            class="form-control"
            formControlName="name"
            id="name"
            placeholder="Name (required)"
            type="text"
          >
          <span *ngIf="displayMessage['name']" class="text-danger">
            <p [innerHTML]="displayMessage['name']"></p>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label class="col-md-2 control-label" for="cpf">CPF</label>
        <div class="col-md-10">
          <input
            [ngClass]="{'is-invalid': displayMessage['cpf'] }"
            class="form-control"
            formControlName="cpf"
            id="cpf"
            mask="000.000.000-99"
            placeholder="CPF (required)"
            type="text"
          >
          <span *ngIf="displayMessage['cpf']" class="text-danger">
            <p [innerHTML]="displayMessage['cpf']"></p>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label class="col-md-2 control-label" for="email">Email</label>
        <div class="col-md-10">
          <input
            [ngClass]="{'is-invalid': displayMessage['email'] }"
            class="form-control"
            formControlName="email"
            id="email"
            placeholder="Email (required)"
            type="email"
          >
          <span *ngIf="displayMessage['email']" class="text-danger">
            <p [innerHTML]="displayMessage['email']"></p>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label class="col-md-2 control-label" for="password">Password</label>
        <div class="col-md-10">
          <input
            [ngClass]="{'is-invalid': displayMessage['password'] }"
            class="form-control"
            formControlName="password"
            id="password"
            placeholder="Password (required)"
            type="password"
          >
          <span *ngIf="displayMessage['password']" class="text-danger">
            <p [innerHTML]="displayMessage['password']"></p>
          </span>
        </div>
      </div>

      <div class="form-group">
        <label class="col-md-2 control-label" for="confirm-password">Confirm Password</label>
        <div class="col-md-10">
          <input
            [ngClass]="{'is-invalid': displayMessage['confirmPassword'] }"
            class="form-control"
            formControlName="confirmPassword"
            id="confirm-password"
            placeholder="Confirm Password (required)"
            type="password"
          >
          <span *ngIf="displayMessage['confirmPassword']" class="text-danger">
            <p [innerHTML]="displayMessage['confirmPassword']"></p>
          </span>
        </div>
      </div>

      <div class="form-group">
        <div class="col-md-4 col-md-offset-2">
          <span>
            <button [disabled]="!signupForm.valid" class="btn btn-success" id="signup" type="submit">Signup</button>
          </span>
        </div>
      </div>
    </div>
  </form>
</div>
